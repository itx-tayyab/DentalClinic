services:
  db:
    image: postgres:17.12-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dental
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dental_clinic
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dental -d dental_clinic"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://dental:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dental_clinic?schema=public
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?set ACCESS_TOKEN_SECRET in .env}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?set REFRESH_TOKEN_SECRET in .env}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Karachi}
      CORS_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:3000}
      PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  client:
    build:
      context: ./client
    restart: unless-stopped
    environment:
      API_BASE_URL: http://server:8000
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Karachi}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Dev-only helper: `docker compose --profile tools run --rm seed`
  # Uses the build stage, which still has dev dependencies and the seed script.
  seed:
    profiles: ["tools"]
    build:
      context: ./server
      target: build
    environment:
      DATABASE_URL: postgresql://dental:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/dental_clinic?schema=public
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Asia/Karachi}
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:seed"]

volumes:
  dbdata:
